server.port=8080
eureka.instance.prefer-ip-address=true
# Enable discovery-based routing
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true


# Auth Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://Hotel-AuthService
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# Hotel Service
spring.cloud.gateway.server.webflux.routes[1].id=hotel-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://HotelService
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/hotels/**

# Booking Service
spring.cloud.gateway.server.webflux.routes[2].id=booking-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://Hotel-BookingService
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/bookings/**

# User Service
spring.cloud.gateway.server.webflux.routes[3].id=user-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://Hotel-UserService
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/users/**

# Room endpoints
spring.cloud.gateway.server.webflux.routes[4].id=room-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://HotelService
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/rooms/**
